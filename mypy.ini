[mypy]

python_version = 3.11                    
strict = True                            

ignore_missing_imports = True            
disallow_any_generics = False  
disallow_subclassing_any = False            
no_implicit_reexport = True              

check_untyped_defs = True                
warn_unused_ignores = True               
warn_redundant_casts = True              
warn_unused_configs = True               
warn_return_any = False                   
strict_optional = True                   

plugins = pydantic.mypy

[mypy-plugins.pydantic]
init_typed = True
init_forbid_extra = True
warn_required_dynamic_aliases = True

[mypy-sqlalchemy.*]                      
ignore_errors = True

[mypy-alembic.*]                         
ignore_errors = True

[mypy-loguru.*]                          
ignore_errors = True

[mypy-fastapi.*]                         
ignore_errors = True

[mypy-uvicorn.*]                         
ignore_errors = True

[mypy-starlette.*]                       
ignore_errors = True

[mypy-jose.*]                            
ignore_errors = True

[mypy-passlib.*]                         
ignore_errors = True

[mypy-pil.*]                             
ignore_errors = True

[mypy-aioredis.*]                        
ignore_errors = True

[mypy-aiofiles.*]                        
ignore_errors = True

[mypy-multipart.*]                       
ignore_errors = True  

[mypy-myapp.tests.*]                     
disable_error_code = import-untyped

[mypy-myapp.migrations.*]                
ignore_errors = True
